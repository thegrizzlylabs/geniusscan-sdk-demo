// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "androidx.benchmark:benchmark-gradle-plugin:1.5.0"
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.20'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.4.20'
        classpath 'org.jetbrains.dokka:dokka-gradle-plugin:1.9.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Needed for public demo apps
        maven {
            url 'https://s3.amazonaws.com/tgl.maven'
            content {
                includeGroup('com.geniusscansdk')
            }
        }
    }
}

ext {
    ndkVersion = '27.2.12479018'
    compileSdkVersion = 37
    targetSdkVersion = 37
    minSdkVersion = 23
}
