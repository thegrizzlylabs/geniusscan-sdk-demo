name: DotNetMaui

# Note: using the `branches` selector excludes all tags
on:
  push:
    branches:
      - '**'

jobs:
  build-android:
    runs-on: macos-26
    environment:
      name: package-publication
      deployment: false
    steps:
    - uses: actions/checkout@v4
    # Retry in case plugin is not yet available on nuget
    - uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_wait_seconds: 300
        command: |
          set -e
          cd dotnet-maui
          sudo dotnet workload restore
          dotnet build SimpleDemo.csproj -f net9.0-android
          dotnet build SimpleDemo.csproj -f net10.0-android
  build-ios:
    runs-on: xcode-27
    environment:
      name: package-publication
      deployment: false
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        # The installed .NET 10 iOS workload requires Xcode 27.
        xcode-version: '27.0'
    # Retry in case plugin is not yet available on nuget
    - uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_wait_seconds: 300
        command: |
          set -e
          cd dotnet-maui
          sudo dotnet workload restore
          dotnet build SimpleDemo.csproj -f net10.0-ios
