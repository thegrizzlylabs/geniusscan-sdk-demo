name: DotNetMaui

# Note: using the `branches` selector excludes all tags
on:
  push:
    branches:
      - '**'

jobs:
  build-android:
    runs-on: macos-26
    environment:
      name: package-publication
      deployment: false
    steps:
    - uses: actions/checkout@v4
    # Retry in case plugin is not yet available on nuget
    - uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_wait_seconds: 300
        command: |
          set -e
          cd dotnet-maui
          sudo dotnet workload restore
          dotnet build SimpleDemo.csproj -f net9.0-android
          dotnet build SimpleDemo.csproj -f net10.0-android
  build-ios-dotnet9:
    runs-on: macos-26
    environment:
      name: package-publication
      deployment: false
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        # The installed .NET 9 iOS workload requires Xcode 26.5.
        xcode-version: '26.5'
    # Retry in case plugin is not yet available on nuget
    - uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_wait_seconds: 300
        command: |
          set -e
          cd dotnet-maui
          sudo dotnet workload restore
          dotnet build SimpleDemo.csproj -f net9.0-ios
  build-ios-dotnet10:
    runs-on: macos-26
    environment:
      name: package-publication
      deployment: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        # Required by the Xcode 26.6-compatible MAUI workload set.
        dotnet-version: '10.0.401'
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        # The installed .NET 10.401 iOS workload requires Xcode 26.6.
        xcode-version: '26.6'
    # Retry in case plugin is not yet available on nuget
    - uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_wait_seconds: 300
        command: |
          set -e
          cd dotnet-maui
          dotnet workload install maui --version 10.0.401
          dotnet workload --info
          dotnet build SimpleDemo.csproj -f net10.0-ios
